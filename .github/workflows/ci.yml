name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint y Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chronos-next

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chronos-next/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Valores placeholder: el build no ejecuta las rutas ni consulta datos reales,
          # solo necesita que las variables existan para compilar.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: TEST-placeholder
          MERCADOPAGO_ACCESS_TOKEN: TEST-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
